<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>captiOnline 連絡チャット通知 設定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      font-size: 13px;
      background: #fff;
      color: #222;
    }

    header {
      background: #1a6e3c;
      color: #fff;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.03em;
    }

    .section {
      padding: 12px 14px;
      border-bottom: 1px solid #e8e8e8;
    }

    .section:last-child { border-bottom: none; }

    .section-title {
      font-size: 11px;
      font-weight: bold;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    /* トグルスイッチ */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .row:last-child { margin-bottom: 0; }

    .row label { color: #333; }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }

    .toggle input { display: none; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track { background: #1a6e3c; }

    .toggle-track::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: left 0.2s;
    }

    .toggle input:checked + .toggle-track::after { left: 21px; }

    /* 音量スライダー */
    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #1a6e3c;
      cursor: pointer;
    }

    #volume-display {
      min-width: 30px;
      text-align: right;
      color: #555;
    }

    /* テスト再生ボタン */
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 11px;
      color: #333;
      transition: background 0.15s;
    }

    .btn:hover { background: #e8e8e8; }
    .btn:active { background: #ddd; }

    /* 動作状況 */
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .status-row:last-child { margin-bottom: 0; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-green  { background: #28a745; }
    .dot-red    { background: #dc3545; }
    .dot-yellow { background: #ffc107; }
    .dot-gray   { background: #aaa; }

    /* 通知権限ボタン */
    #btn-request-permission {
      display: none;
      width: 100%;
      margin-top: 6px;
      padding: 6px;
      background: #dc3545;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    #btn-request-permission:hover { background: #c82333; }
  </style>
</head>
<body>

<header>captiOnline 連絡チャット通知</header>

<!-- 通知設定 -->
<div class="section">
  <div class="section-title">通知設定</div>

  <div class="row">
    <label for="toggle-sound">通知音</label>
    <label class="toggle">
      <input type="checkbox" id="toggle-sound">
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="row">
    <label for="toggle-os">OS通知（バナー）</label>
    <label class="toggle">
      <input type="checkbox" id="toggle-os">
      <span class="toggle-track"></span>
    </label>
  </div>
</div>

<!-- 音量 -->
<div class="section">
  <div class="section-title">音量</div>
  <div class="volume-wrap">
    <input type="range" id="volume-slider" min="0" max="100" step="5">
    <span id="volume-display">70%</span>
  </div>
  <div class="btn-group">
    <button class="btn" id="btn-test-all">▶ テスト（全員宛）</button>
    <button class="btn" id="btn-test-me">▶ テスト（自分宛）</button>
  </div>
</div>

<!-- 動作状況 -->
<div class="section">
  <div class="section-title">動作状況</div>

  <div class="status-row">
    <span class="dot" id="dot-observer"></span>
    <span id="status-observer">確認中…</span>
  </div>

  <div class="status-row">
    <span class="dot" id="dot-permission"></span>
    <span id="status-permission">確認中…</span>
  </div>

  <button id="btn-request-permission">通知を許可する</button>
</div>

<script src="popup.js"></script>
</body>
</html>
